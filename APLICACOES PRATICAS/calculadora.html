<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Calculadora Simples</h1>
    <input type="number" id="num1" placeholder="Número 1">
    <input type="number" id="num2" placeholder="Número 2">
    <br><br>
    <button id="add">Somar</button>
    <button id="subtract">Subtrair</button>
    <button id="multiply">Multiplicar</button>
    <button id="divide">Dividir</button>
    <br><br>
    <p>Resultado: <span id="result">0</span></p>

    <script>
        const num1 = document.getElementById("num1");
        const num2 = document.getElementById("num2");
        const result = document.getElementById("result");

        document.getElementById("add").addEventListener("click", () => {
            result.textContent = Number(num1.value) + Number(num2.value);
        });

        document.getElementById("subtract").addEventListener("click", () => {
            result.textContent = Number(num1.value) - Number(num2.value);
        });

        document.getElementById("multiply").addEventListener("click", () => {
            result.textContent = Number(num1.value) * Number(num2.value);
        });

        document.getElementById("divide").addEventListener("click", () => {
            if (num2.value == 0) {
                result.textContent = "Erro: Divisão por zero!";
            } else {
                result.textContent = Number(num1.value) / Number(num2.value);
            }
        });
    </script>
</body>
</html>
